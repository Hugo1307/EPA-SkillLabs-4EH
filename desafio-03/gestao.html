<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestão — Marketplace Inforlândia</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Gestão do marketplace</h1>
      <p>Dados internos: custo, margem e fornecedor</p>
    </header>

    <main>
      <button id="sair" type="button">Terminar sessão</button>

      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Preço</th>
            <th>Custo</th>
            <th>Margem</th>
            <th>Fornecedor</th>
          </tr>
        </thead>
        <tbody id="linhas"></tbody>
      </table>
    </main>

    <script src="/gestao.js"></script>
  </body>
</html>
