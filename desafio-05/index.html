<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marketplace Inforlândia</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Marketplace Inforlândia</h1>
      <p>Equipamento informático recondicionado</p>
    </header>

    <main>
      <div class="pesquisa">
        <input id="pesquisa" type="text" placeholder="Pesquisar por série, marca ou modelo" />
        <label class="opcao">
          <input id="noServidor" type="checkbox" /> Pesquisar no servidor
        </label>
      </div>

      <p id="contagem" class="contagem"></p>

      <table>
        <thead>
          <tr>
            <th>Nº de série</th>
            <th>Equipamento</th>
            <th>Disco</th>
            <th>RAM</th>
            <th>Estado</th>
            <th>Preço</th>
          </tr>
        </thead>
        <tbody id="linhas"></tbody>
      </table>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
