<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — Marketplace Inforlândia</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Área de gestão</h1>
      <p>Acesso reservado à equipa</p>
    </header>

    <main>
      <p id="mensagem" class="mensagem escondida"></p>

      <form id="formulario">
        <label>Utilizador <input id="utilizador" type="text" required /></label>
        <label>Palavra-passe <input id="palavraPasse" type="password" required /></label>
        <button type="submit">Entrar</button>
      </form>
    </main>

    <script src="/login.js"></script>
  </body>
</html>
